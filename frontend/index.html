    <div id="root"></div>
    <script>
      // Self-heal poisoned/stale deploys (HTML served as .js → Unexpected token '<').
      // Up to 2 reloads; strips old cache-busters; clears SW/caches.
      (function () {
        var KEY = '__tup_boot_reload_n';
        var MAX = 2;
        function count() {
          try { return parseInt(sessionStorage.getItem(KEY) || '0', 10) || 0; } catch (e) { return 0; }
        }
        function bump() {
          try { sessionStorage.setItem(KEY, String(count() + 1)); } catch (e) {}
        }
        function clear() {
          try { sessionStorage.removeItem(KEY); } catch (e) {}
        }
        function heal() {
          if (count() >= MAX) return;
          bump();
          try {
            if (window.caches && caches.keys) {
              caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); });
            }
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
              navigator.serviceWorker.getRegistrations().then(function (rs) {
                rs.forEach(function (r) { r.unregister(); });
              });
            }
          } catch (e) {}
          var u = location.href.split('#')[0].replace(/([?&])_tup=\d+/g, '$1').replace(/[?&]$/, '');
          location.replace(u + (u.indexOf('?') >= 0 ? '&' : '?') + '_tup=' + Date.now());
        }
        function isHtmlAsJs(msg) {
          return /Unexpected token\s*['"]?</i.test(String(msg || ''));
        }
        window.addEventListener('error', function (e) {
          var t = e && e.target;
          if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
            heal();
            return;
          }
          if (e && isHtmlAsJs(e.message)) heal();
        }, true);
        window.addEventListener('load', function () {
          setTimeout(function () {
            var root = document.getElementById('root');
            if (root && root.childElementCount === 0) heal();
            else clear();
          }, 4000);
        });
      })();
    </script>
